# KJT Invest for Linux: every change on main builds the one-file installers (.flatpak) for PCs (x86_64)
# and for Linux phones and other ARM devices (aarch64), and keeps the newest ones in the branch "bundle".
name: Build the Linux app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bundle
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            label: Linux
          - arch: aarch64
            runner: ubuntu-24.04-arm
            label: Linux ARM
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -e
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --disable-rofiles-fuse --force-clean --default-branch=stable --arch=${{ matrix.arch }} \
            --install-deps-from=flathub --repo=repo build today.knowingjesus.Invest.yml
          VER=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" src/kjt_invest.py)
          mkdir -p out
          flatpak build-bundle --arch=${{ matrix.arch }} --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "out/KJT Invest $VER (${{ matrix.label }}).flatpak" today.knowingjesus.Invest stable
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}
          path: out
          retention-days: 3
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Keep the newest installers in the branch "bundle"
        run: |
          mkdir -p b && find art -name '*.flatpak' -exec cp {} b/ \;
          ls -la b
          [ -n "$(ls b)" ] || { echo "nothing was built"; exit 1; }
          cd b && git init -q -b bundle && git add -A && git -c user.email=ci@local -c user.name=CI commit -qm "KJT Invest Linux bundles" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bundle
