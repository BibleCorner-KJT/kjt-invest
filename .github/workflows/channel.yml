# KJT Finance for Linux. Every change on main:
#  1. builds the app for PCs (x86_64) and for Linux phones / ARM devices (aarch64);
#  2. when the secret FLATPAK_GPG_KEY is set: signs both and publishes the app's own update channel at
#     https://biblecorner-kjt.github.io/kjt-invest/ (GNOME Software then updates installed copies by itself);
#  3. keeps the newest one-file installers (.flatpak) in the branch "bundle".
# The signing key lives only in the repository secret; it never appears in the files or the logs.
name: Build and publish the Linux app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: channel
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -e
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --disable-rofiles-fuse --force-clean --default-branch=stable --arch=${{ matrix.arch }} \
            --install-deps-from=flathub --repo=repo build today.knowingjesus.Invest.yml
          tar -cf repo-${{ matrix.arch }}.tar repo
      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.arch }}
          path: repo-${{ matrix.arch }}.tar
          retention-days: 2
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    outputs:
      signed: ${{ steps.pub.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - id: pub
        name: Sign, make the channel and the one-file installers
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          set -e
          git config --global --add safe.directory '*'
          APP=today.knowingjesus.Invest
          URL=https://biblecorner-kjt.github.io/kjt-invest
          RT=https://dl.flathub.org/repo/flathub.flatpakrepo
          VER=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" src/kjt_invest.py)
          mkdir -p src-repos out
          for a in x86_64 aarch64; do
            if [ -f "art/repo-$a/repo-$a.tar" ]; then mkdir -p "src-repos/$a" && tar -xf "art/repo-$a/repo-$a.tar" -C "src-repos/$a"; fi
          done
          ls src-repos
          label() { if [ "$1" = aarch64 ]; then echo "Linux ARM"; else echo "Linux"; fi; }
          if [ -n "$GPG_KEY" ]; then
            export GNUPGHOME="$RUNNER_TEMP/gpg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
            printf '%s\n' "$GPG_KEY" | gpg --batch --import 2>/dev/null
            FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
            gpg --export "$FPR" > channel-key.gpg
            ostree init --repo=repo --mode=archive-z2
            for a in $(ls src-repos); do
              for R in $(ostree refs --repo="src-repos/$a/repo" | grep "^app/$APP/"); do
                flatpak build-commit-from --src-repo="src-repos/$a/repo" --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" --no-update-summary repo "$R"
              done
            done
            flatpak build-update-repo --generate-static-deltas --prune --title="KJT Finance" --default-branch=stable \
              --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" repo
            KEY=$(base64 -w0 channel-key.gpg)
            mkdir -p site && cp -r repo site/repo && cp channel/index.html channel/icon.png site/ && cp channel-key.gpg site/kjt-invest-channel.gpg
            printf '[Flatpak Repo]\nTitle=KJT Finance\nUrl=%s/repo/\nHomepage=https://knowingjesus.today/\nComment=KJT Finance for Linux (Knowing Jesus Today)\nIcon=%s/icon.png\nDefaultBranch=stable\nGPGKey=%s\n' "$URL" "$URL" "$KEY" > site/kjt-invest.flatpakrepo
            printf '[Flatpak Ref]\nName=%s\nBranch=stable\nTitle=KJT Finance\nUrl=%s/repo/\nSuggestRemoteName=kjt-invest\nHomepage=https://knowingjesus.today/\nIcon=%s/icon.png\nRuntimeRepo=%s\nIsRuntime=false\nGPGKey=%s\n' "$APP" "$URL" "$URL" "$RT" "$KEY" > site/kjt-invest.flatpakref
            for a in $(ls src-repos); do
              F="KJT Finance $VER ($(label $a)).flatpak"
              flatpak build-bundle --arch=$a --repo-url=$URL/repo/ --runtime-repo=$RT --gpg-keys=channel-key.gpg repo "out/$F" $APP stable
              if [ "$a" = aarch64 ]; then cp "out/$F" site/kjt-invest-linux-arm.flatpak; else cp "out/$F" site/kjt-invest-linux.flatpak; fi
            done
            printf '{"version":"%s"}\n' "$VER" > site/linux.json
            touch site/.nojekyll
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "No FLATPAK_GPG_KEY secret yet: one-file installers only (no update channel)."
            for a in $(ls src-repos); do
              flatpak build-bundle --arch=$a --runtime-repo=$RT "src-repos/$a/repo" "out/KJT Finance $VER ($(label $a)).flatpak" $APP stable
            done
            echo "signed=0" >> "$GITHUB_OUTPUT"
          fi
          ls -la out
          cd out && git init -q -b bundle && git add -A && git -c user.email=ci@local -c user.name=CI commit -qm "KJT Finance $VER Linux installers" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bundle
      - if: steps.pub.outputs.signed == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: publish
    if: needs.publish.outputs.signed == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
