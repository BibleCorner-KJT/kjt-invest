<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data:; connect-src *">
<title>KJT Finance</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <button id="back" class="iconbtn" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 id="title">KJT Finance</h1>
  <button id="search" class="iconbtn" aria-label="Search transactions">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
  </button>
  <button id="eye" class="iconbtn" aria-label="Hide or show amounts" title="Hide or show amounts (Ctrl+H)">
    <svg viewBox="0 0 24 24"><path class="eo" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="eo" cx="12" cy="12" r="3"/><path class="ec" d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.2M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
  </button>
  <button id="refresh" class="iconbtn" aria-label="Update prices">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
  </button>
  <button id="settings" class="iconbtn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<div id="upd" hidden></div>
<main id="view"><p class="loading">Opening…</p></main>
<nav id="tabs">
  <button data-tab="overview" class="on"><i class="ico"><svg viewBox="0 0 24 24"><rect class="f" x="3" y="12" width="4.5" height="8" rx="1.5"/><rect class="f" x="9.75" y="4" width="4.5" height="16" rx="1.5"/><rect class="f" x="16.5" y="8.5" width="4.5" height="11.5" rx="1.5"/></svg></i><span>Overview</span></button>
  <button data-tab="assetsgroup"><i class="ico"><svg viewBox="0 0 24 24"><path class="f" d="M5 10.5 12 5l7 5.5V20H5z"/><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-5.5h4V20"/></svg></i><span>Assets</span></button>
  <button data-tab="money"><i class="ico"><svg viewBox="0 0 24 24"><rect class="f" x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M5.5 7.5 15.5 4l1.2 3.5"/><path d="M21 12h-4.5a1.75 1.75 0 0 0 0 3.5H21"/></svg></i><span>Cash flow</span></button>
  <button data-tab="markets"><i class="ico"><svg viewBox="0 0 24 24"><path class="f" d="M3 17.5 8 11l4 4 8-9V20H3z" stroke="none"/><path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h5v5"/></svg></i><span>Prices</span></button>
  <button data-tab="stewardship"><i class="ico"><svg viewBox="0 0 24 24"><path d="M12 2.5v19M9.5 5h5M6.5 9h11M8.5 15.5l7 2.6"/></svg></i><span>Steward</span></button>
</nav>
<div id="sheet" hidden><div class="sheet-bg"></div><div class="sheet-box"></div></div>
<div id="dlg" hidden><div class="dlg-bg"></div><div class="dlg-box"><p></p><div class="btns"><button class="btn light" data-n>Cancel</button><button class="btn" data-y>Delete</button></div></div></div>
<div id="lock" hidden></div>
<div id="toast" hidden></div>
<div id="selbar" hidden></div>
<button id="fab" hidden aria-label="Add a transaction"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="print" aria-hidden="true"></div>
<script src="sql-wasm-b64.js"></script>
<script src="sql-wasm.js"></script>
<script src="app.js"></script>
</body>
</html>
